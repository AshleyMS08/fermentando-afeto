<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fermentando Afeto | Receitas</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body onload="validarSessao(), atualizarFeed()" style="background-color: #161618;">

    <div class="janela">


        <div class="header-left">

            <h1>Fermentando Afeto</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="cards.html">
                    <h3>Receitas</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="./dashboard.html">
                    <h3>Calculadora de Receitas</h3>
                </a>
            </div>

            <div class="btn-nav">
                <h3>Dashboards</h3>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash-right">


            <div class="avisos">
                <div id="alerta">
                </div>
                <div class="container">
                    <h1>Publicar um aviso</h1>
                    <div class="div-form">
                        <form id="form_postagem" method="post" onsubmit="return publicar()">
                            <label>
                                Título:
                                <br>
                                <input name="titulo" id="titulo" maxlength="100" type="text">
                            </label>
                            <br>
                            <br>
                            <label>
                                Descrição (máximo de 250 caracteres):
                                <br>
                                <textarea name="descricao" id="textarea_descricao" maxlength="250" rows="5"></textarea>
                            </label>
                            <br>
                            <br>
                            <button>Enviar</button>
                        </form>
                    </div>
                    <h1>Mural de Avisos</h1>
                    <div class="div-results">
                        <div id="feed_container" class="feed-container">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>




</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    function limparFormulario() {
        document.getElementById("form_postagem").reset();
    }

    function publicar() {
        var idUsuario = sessionStorage.ID_USUARIO;
        var corpo = {
            titulo: form_postagem.titulo.value,
            descricao: form_postagem.descricao.value
        }

        fetch(`/avisos/publicar/${idUsuario}`, {
            method: "POST",
            headers: {"Content-Type": "aplication/json"},
            body: JSON.stringify(corpo)
        }).then(function (resposta) {
            if(resposta.ok) {
                window.alert('Comentário publicado!');
                atualizarFeed();
                limparFormulario();
            } else {
                throw ("Erro ao postar comentário.");
            }
        }).catch(function (erro) {console.log(erro); });

        return false;
    }

    function atualizarFeed() {
        fetch("/avisos/listar").then(function (resposta) {
            if (resposta.ok) {
                if (resposta.status == 204) {
                    document.getElementById("feed_container").innerHTML = "<span>Nenhum comentário ainda, Seja o primeiro!</span>";
                    return;
                }
                resposta.json().then(function (reposta) {
                    var feed = document.getElementById("feed_container");
                    feed.innerHTML = "";
                    for(let i = 0; i < resposta.length; i++) {
                        var publicacao = reposta[i];

                        feed.innerHTML += `
                            <div class="publicacao">
                                <span class="publicacao-nome"><br> Autor: <b> ${publicacao.nome}</b></span>
                                <span class="publicacao-titulo"><br> Autor: <b> ${publicacao.nome}</b></span>
                                <span class="publicacao-nome"><br> Autor: <b> ${publicacao.nome}</b></span>
                                </div>
                            
                            
                        `
                    }
                })
            }
        })
    }
</script>

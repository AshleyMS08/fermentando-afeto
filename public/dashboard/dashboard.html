<body>

    <div class="janela">
        <div class="header-left">
            <h1>Fermentando Afeto</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="./cards.html">
                    <h3>Receitas</h3>
                </a>
            </div>

            <div class="btn-nav">

                <h3>Dashboard</h3>

            </div>

            <div class="btn-nav-white">

        <div class="dash">

            <div class="kpis-container">
                <div class="card-kpi">
                    <h3>Experiência Predominante</h3>
                    <h2 id="kpi_experiencia">Carregando...</h2>
                </div>
                <div class="card-kpi">
                    <h3>Objetivo Mais Voltado</h3>
                    <h2 id="kpi_objetivo">Carregando...</h2>

            <div class="graficos-container">
                <div class="box-grafico">
                    <h3>Objetivos dos Usuários</h3>

                        <canvas id="chartObjetivos"></canvas>
                    </div>
                </div>

                <div class="box-grafico">

                    <div class="graph">
                        <canvas id="chartCategorias"></canvas>
                    </div>
                </div>
            </div>
        </div>
</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    const TEMPO_ATUALIZACAO_MS = 30000;

    window.onload = function () {
        carregarKPIExperiencia();
        carregarKPIObjetivo();
        carregarGraficoObjetivos();
        carregarGraficoCategorias();
    };

    function carregarKPIExperiencia() {
        fetch("/medidas/kpi-experiencia", { cache: 'no-store'}).then(function (resposta){
            if(resposta.ok && resposta.status != 204) {
                resposta.json().then(function (dados) {
                    document.getElementById("kpi_experiencia").innerHTML = dados[0].nivelExperiencia;
                });
            }
        });
    }

    function carregarKPIObjetivo() {
        fetch("/medidas/kpi-objetivo", { cache: 'no-store'}).then(function (resposta){
            if(resposta.ok && resposta.status != 204) {
                resposta.json().then(function (dados) {
                    document.getElementById("kpi_objetivo").innerHTML = dados[0].nivelExperiencia;
                });
            }
        });
    }

    function obterDadosGraficoObjetivo() {
        fetch("/medidas/grafico-experiencia", {cache: 'no-store'})
        .then(function (response) {
            if(response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos (Objetivos): ${JSON.stringify(resposta)}`);

                    plotarGraficoObjetivos(resposta);
                });
            } else {
                console.log(`Nenhum dado encontrado ou erro na KPI de Objetivos`);
            }
        })
        .catch(function (error) {
            console.error(`Erro na obtenção de dados p/ gráfico de objetivos ${error.massage}`);
        });
    }

    function plotarGraficoObjetivos(resposta) {
        console.log('Iniciando plotagem do gráfico de Objetivos...');

        let labels = [];
        datsets: [{
            label: 'Usuários',
            data:[],
            backgroundColor: ['#e6005a', '#32b9cd', '#ffca56', '#4bc0c0'],
            borderWidth: 1
        }]
    };

    for (let i = 0; i < resposta.length; i++) {
        var registro = resposta[i];
        labels.push(registro.objetivo);
        dadosConstrucao.datasets[0].data.push(registro.total_usuarios);
    }

    const config = {
        type: 'doughnut',
        data: dadosConstrucao,
        options: {
            plugins: { legend: {labels: { color: 'white' } } }
        }
    };

    let chartObj = new Chart(
        document.getElementById('chartObjetivos'),
        config
    );

    setTimeout(() => atualizarGraficoObjetivos(dadosConstrucao, chartObj), TEMPO_ATUALIZACAO_MS);


</script>
